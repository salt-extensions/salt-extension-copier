---
minimum_pre_commit_version: 3.2.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # renovate: datasource=git-tags depName=pre-commit-hooks packageName=https://github.com/pre-commit/pre-commit-hooks depType=devDependencies
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: end-of-file-fixer
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-yaml
      - id: check-ast
      - id: check-builtin-literals
      - id: debug-statements
        language_version: python3

  - repo: https://github.com/asottile/pyupgrade
    # renovate: datasource=git-tags depName=pyupgrade packageName=https://github.com/asottile/pyupgrade depType=devDependencies
    rev: 75992aaa40730136014f34227e0135f63fc951b4  # v3.21.2
    hooks:
      - id: pyupgrade
        name: Rewrite code for Py3.11+
        args:
          - --py311-plus

  - repo: https://github.com/PyCQA/isort
    # renovate: datasource=git-tags depName=isort packageName=https://github.com/PyCQA/isort depType=devDependencies
    rev: 9f905615631c545f5aea2516508109350d1d2f7d  # 9.0.2
    hooks:
      - id: isort
        args:
          - --py=311
          - --profile=black
          - --force-single-line
        exclude: project/src/\{\{ namespaced_package_path \}\}/__init__.py

  - repo: https://github.com/psf/black
    # renovate: datasource=git-tags depName=black packageName=https://github.com/psf/black depType=devDependencies
    rev: 4f1883b1f15305a0e83a7c87991f46292bf09f85  # 26.10.0
    hooks:
      - id: black
        name: Autoformat Python code
        args:
          - --line-length=100
          - --target-version=py311

  - repo: local
    hooks:
      - id: nox
        alias: lint-tools
        name: Lint Tools
        pass_filenames: false
        language: python
        entry: nox -e lint-tools-pre-commit --
        files: ^(project/tools|(?!(project/|tests/|docs/conf)))[^{]*\.py$
        require_serial: true
        additional_dependencies:
          # renovate: datasource=pypi depName=nox depType=devDependencies
          - nox==2026.8.17
          # Speeds up the session install and, since prek-created hook envs
          # don't include pip, provides the uv install path nox needs there.
          # uv only ships wheels for these platforms; elsewhere, the hooks
          # run via pre-commit, whose envs include pip.
          # renovate: datasource=pypi depName=uv depType=devDependencies
          - uv==0.12.23 ; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'

      - id: nox
        alias: lint-tests
        name: Lint Tests
        language: python
        entry: nox -e lint-tests-pre-commit --
        files: ^tests/.*\.py$
        require_serial: true
        additional_dependencies:
          # renovate: datasource=pypi depName=nox depType=devDependencies
          - nox==2026.8.17
          # Speeds up the session install and, since prek-created hook envs
          # don't include pip, provides the uv install path nox needs there.
          # uv only ships wheels for these platforms; elsewhere, the hooks
          # run via pre-commit, whose envs include pip.
          # renovate: datasource=pypi depName=uv depType=devDependencies
          - uv==0.12.23 ; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'

  - repo: https://github.com/kjanat/actionlint
    # renovate: datasource=git-tags depName=actionlint packageName=https://github.com/kjanat/actionlint depType=devDependencies
    rev: 2da2ceb4af2c7ecc48f5b9311d85080c3971b5f0  # v1.17.0
    hooks:
      - id: actionlint-shellcheck
        alias: actionlint
