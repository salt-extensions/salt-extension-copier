---
minimum_pre_commit_version: 3.2.0
repos:
  # renovate: depName=pre-commit-hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: end-of-file-fixer
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-yaml
      - id: check-ast
      - id: check-builtin-literals
      - id: debug-statements
        language_version: python3

  # renovate: depName=pyupgrade
  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312  # v3.22.0
    hooks:
      - id: pyupgrade
        name: Rewrite code for Py3.11+
        args:
          - --py311-plus

  # renovate: depName=isort
  - repo: https://github.com/PyCQA/isort
    rev: 9f905615631c545f5aea2516508109350d1d2f7d  # 9.0.2
    hooks:
      - id: isort
        args:
          - --py=311
          - --profile=black
          - --force-single-line
        exclude: project/src/\{\{ namespaced_package_path \}\}/__init__.py

  # renovate: depName=black
  - repo: https://github.com/psf/black
    rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc  # 26.10.1
    hooks:
      - id: black
        name: Autoformat Python code
        args:
          - --line-length=100
          - --target-version=py311

  - repo: local
    hooks:
      - id: nox
        alias: lint-tools
        name: Lint Tools
        pass_filenames: false
        language: python
        entry: nox -e lint-tools --
        files: ^(project/tools|noxfile|(?!(project/|tests/|docs/conf)))[^{]*\.py$
        require_serial: true
        additional_dependencies:
          # renovate:
          - nox==2026.8.17
          # Speeds up the session install and, since prek-created hook envs
          # don't include pip, provides the uv install path nox needs there.
          # uv only ships wheels for these platforms; elsewhere, the hooks
          # run via pre-commit, whose envs include pip.
          # renovate:
          - uv==0.12.23 ; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'

      - id: nox
        alias: lint-tests
        name: Lint Tests
        language: python
        entry: nox -e lint-tests --
        files: ^tests/.*\.py$
        require_serial: true
        additional_dependencies:
          # renovate:
          - nox==2026.8.17
          # renovate:
          - uv==0.12.23 ; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'

  # renovate: depName=actionlint
  - repo: https://github.com/kjanat/actionlint
    rev: 08bb2c4f0d039744455b87aef1c647fb8b66d37b  # v1.17.0
    hooks:
      - id: actionlint-shellcheck
        alias: actionlint

  # renovate: depName=renovate
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 95bb5478d9f732658452e5bc0dfbeb986832faa9  # 44.138.0
    hooks:
      - id: renovate-config-validator
        alias: renovate
        name: Validate Renovate Config
        args:
          - --no-global  # Passing filenames results in the validator treating it as global by default
          - --strict
