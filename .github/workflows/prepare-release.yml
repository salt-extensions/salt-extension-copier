---
name: Prepare Template Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Override the autogenerated version.
        required: false
        default: ''
        type: string

concurrency:
  # Never prepare two releases in parallel
  group: ${{ github.workflow }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  check-container:
    name: Check prek CI container
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      outdated: ${{ steps.check.outputs.outdated }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check pinned container is built from the current Dockerfile
        id: check
        run: |
          current="$(git hash-object containers/prek.Dockerfile)"
          pinned="$(sed -n "s/^prek_container: '\(.*\)'$/\1/p" data/versions.yaml)"
          if [ -z "$pinned" ]; then
            echo "Failed to parse the prek_container pin from data/versions.yaml" >&2
            exit 1
          fi
          # Images built before the hash label was introduced miss it,
          # which correctly results in a rebuild.
          built=""
          if docker pull --quiet "$pinned"; then
            built="$(docker image inspect --format '{{ index .Config.Labels "io.salt-extensions.dockerfile-hash" }}' "$pinned" || true)"
          fi
          if [ "$built" = "$current" ]; then
            echo "The pinned prek CI container is up to date."
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "The pinned prek CI container needs a rebuild (built from '${built:-unknown}', current '$current')."
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

  build-container:
    name: Rebuild prek CI container
    needs:
      - check-container
    if: needs.check-container.outputs.outdated == 'true'
    uses: ./.github/workflows/build-prek-container.yml
    secrets: inherit
    with:
      # The updated pins are committed to the release PR instead.
      create-pin-pr: false

  prepare-release:
    name: Render changelog and create/update PR
    needs:
      - check-container
      - build-container
    if: >-
      ${{
        !cancelled() &&
        needs.check-container.result == 'success' &&
        contains(fromJSON('["success", "skipped"]'), needs.build-container.result)
      }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Generate autorelease token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.AUTOORG_CLID }}
          private-key: ${{ secrets.AUTOORG_PRIV }}
          permission-contents: write
          permission-pull-requests: write
          # The release PR can contain changes to the container image pin
          # in .github/workflows/pre-commit-action.yml
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=pypi depName=uv depType=dev
          version: '0.12.23'

      - name: Sync OS releases
        run: uv run --no-project tasks/sync_os_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update prek CI container pins
        if: needs.build-container.result == 'success'
        run: python3 tasks/update_container_pins.py "$DIGEST"
        env:
          DIGEST: ${{ needs.build-container.outputs.digest }}

      - name: Get next version
        if: inputs.version == ''
        id: next-version
        run: echo "version=$(python3 project/tools/version.py next)" >> "$GITHUB_OUTPUT"

      - name: Determine release version
        id: version
        env:
          VERSION: ${{ inputs.version != '' && inputs.version || steps.next-version.outputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release version: '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Render changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # renovate: datasource=pypi depName=towncrier depType=dev
          TOWNCRIER_VERSION: '26.9.0'
        run: |
          uvx "towncrier==${TOWNCRIER_VERSION}" build --yes --version "$VERSION"
          sed -i -e 's/[[:space:]]*$//' CHANGELOG.md  # Remove trailing whitespace

      - name: Create/update release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: automation/release
          delete-branch: true
          commit-message: Release ${{ steps.version.outputs.version }}
          sign-commits: true
          labels: release
          title: Release ${{ steps.version.outputs.version }}
          body: |-
            This automated PR prepares the release of salt-extension-copier ${{ steps.version.outputs.version }}.

            It builds the latest changelog and ensures the OS releases data and the prek CI container pins are up to date. When merged, the release tag is created and pushed automatically.

            Before merging, please ensure it's based on the most recent default branch HEAD.

            If you want to rebuild this PR with a custom version or the current date, you can trigger the corresponding workflow manually in `Actions` > `Prepare Template Release` > `Run workflow`.
