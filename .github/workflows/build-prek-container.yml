---
name: Build Prek CI Container

on:
  workflow_dispatch:
    inputs:
      create-pin-pr:
        description: Open a PR updating the container pins to the built image.
        type: boolean
        default: true
  workflow_call:
    # When called (e.g. by the release workflow), the caller is expected
    # to commit the updated pins itself using the digest output.
    inputs:
      create-pin-pr:
        type: boolean
        default: false
    outputs:
      digest:
        description: The digest of the built and pushed container image.
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  IMAGE: ghcr.io/salt-extensions/prek-ci

jobs:
  build:
    runs-on: ubuntu-26.04
    concurrency:
      # Never build/push the container image from two runs in parallel.
      # Lives on the job since workflow-level concurrency is ignored
      # when this workflow is called from another one.
      group: build-prek-container
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Generate autorelease token
        if: inputs.create-pin-pr
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.AUTOORG_CLID }}
          private-key: ${{ secrets.AUTOORG_PRIV }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Python version
        id: python
        run: |
          version="$(sed -n 's/^ARG PYTHON_VERSION=//p' containers/prek.Dockerfile)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute Dockerfile hash
        id: dockerfile
        run: echo "hash=$(git hash-object containers/prek.Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers
          file: containers/prek.Dockerfile
          push: true
          tags: |-
            ${{ env.IMAGE }}:${{ steps.python.outputs.version }}
          # The hash label allows automation to check whether the
          # pinned image was built from the current Dockerfile.
          labels: |-
            io.salt-extensions.dockerfile-hash=${{ steps.dockerfile.outputs.hash }}

      - name: Update CI container pins
        if: inputs.create-pin-pr
        run: python3 tasks/update_container_pins.py "$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Create pin update PR
        if: inputs.create-pin-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: automation/update-prek-ci-container
          delete-branch: true
          commit-message: Update prek CI container
          sign-commits: true
          title: Update prek CI container
          body: >-
            Updates the pinned prek CI container to the image built from
            the current template toolchain.
          add-paths: |-
            .github/workflows/pre-commit-action.yml
            data/versions.yaml
