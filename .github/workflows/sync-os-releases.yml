---
name: Sync OS Releases

on:
  schedule:
    # Mondays at 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch:

concurrency:
  # Never run two syncs in parallel (e.g. a manual dispatch
  # overlapping with the scheduled run)
  group: ${{ github.workflow }}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync OS Releases
    runs-on: ubuntu-26.04

    steps:
      - name: Generate autorelease token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: generate-token
        with:
          client-id: ${{ secrets.AUTOORG_CLID }}
          private-key: ${{ secrets.AUTOORG_PRIV }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # renovate: datasource=pypi depName=uv depType=dev
          version: '0.13.5'

      - name: Sync OS releases
        run: uv run --no-project tasks/sync_os_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: sync-os-releases
          delete-branch: true
          commit-message: Sync available/default OS releases
          sign-commits: true
          title: Sync available/default OS releases
          body: >-
            Automated update of the OS releases offered by the `*_releases`
            questions, based on upstream support status
            ([endoflife.date](https://endoflife.date)) and release
            availability in the [vmactions](https://github.com/vmactions)
            actions.
          add-paths: data/os_support.yaml
