---
name: Sync OS Releases

on:
  schedule:
    # Mondays at 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync OS Releases
    runs-on: ubuntu-24.04

    steps:
      # We support running with and without a dedicated app.
      # Registering a dedicated app allows CI to run on the sync PR.
      - name: Check if autorelease app was setup
        id: check-app
        env:
          AUTORELEASE_CLID: ${{ secrets.AUTORELEASE_CLID }}
          AUTORELEASE_PRIV: ${{ secrets.AUTORELEASE_PRIV }}
        run: |-
          if [ -n "$AUTORELEASE_CLID" ] && [ -n "$AUTORELEASE_PRIV" ]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate autorelease token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.check-app.outputs.available == '1'
        id: generate-token
        with:
          app-id: ${{ secrets.AUTORELEASE_CLID }}
          private-key: ${{ secrets.AUTORELEASE_PRIV }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync OS releases
        # uv is preinstalled on GitHub-hosted runners
        run: uv run --no-project tasks/sync_os_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.check-app.outputs.available == '1' && steps.generate-token.outputs.token || github.token }}
          commit-message: Sync available/default OS releases
          branch: sync-os-releases
          title: Sync available/default OS releases
          body: >-
            Automated update of the OS releases offered by the `*_releases`
            questions, based on upstream support status
            ([endoflife.date](https://endoflife.date)) and release
            availability in the [vmactions](https://github.com/vmactions)
            actions.


            ${{ steps.check-app.outputs.available == '0' &&
            'Note: PRs created with the workflow token do not trigger CI.
            Close and reopen this PR to run it.' || '' }}
