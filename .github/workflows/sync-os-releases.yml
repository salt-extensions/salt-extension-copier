---
name: Sync OS Releases

on:
  schedule:
    # Mondays at 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync OS Releases
    runs-on: ubuntu-26.04

    steps:
      - name: Generate autorelease token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.AUTORELEASE_CLID }}
          private-key: ${{ secrets.AUTORELEASE_PRIV }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=pypi depName=uv depType=dev
          version: '0.12.23'

      - name: Sync OS releases
        run: uv run --no-project tasks/sync_os_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: Sync available/default OS releases
          branch: sync-os-releases
          title: Sync available/default OS releases
          body: >-
            Automated update of the OS releases offered by the `*_releases`
            questions, based on upstream support status
            ([endoflife.date](https://endoflife.date)) and release
            availability in the [vmactions](https://github.com/vmactions)
            actions.
