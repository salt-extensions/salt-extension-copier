---
name: Testing

on:
  workflow_call:

jobs:
  Linux:
    runs-on: ubuntu-26.04
    # Needs headroom above the per-test pytest timeout so hung tests
    # fail with a traceback instead of the job being cancelled.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need the full history for update tests
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Cache Package Downloads
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The test suite invokes all of these at some point
          path: |-
            ~/.cache/pip
            ~/.cache/uv
            ~/.cache/prek
            ~/.cache/pre-commit
          key: testrun-${{ runner.os }}-${{ hashFiles('noxfile.py', 'project/pyproject.toml.j2', 'project/noxfile.py.j2', 'project/.pre-commit-config.yaml.j2') }}
          restore-keys: |-
            testrun-${{ runner.os }}-

      - name: Install uv/nox
        run: |
          pip install "uv==${UV_VERSION}" "nox==${NOX_VERSION}"
        env:
          # renovate: datasource=pypi depName=nox depType=dev
          NOX_VERSION: '2026.8.17'
          # renovate: datasource=pypi depName=uv depType=dev
          UV_VERSION: '0.13.0'

      - name: Install Test Requirements
        run: |
          nox --force-color -e tests --install-only

      - name: Test
        env:
          SKIP_REQUIREMENTS_INSTALL: '1'
        run: |
          nox --force-color -e tests -- -vv --instafail tests/

      - name: Upload Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtests-${{ runner.os }}.log
          path: artifacts/runtests-*.log

      - name: Set Exit Status
        if: ${{ !cancelled() }}
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus
          if-no-files-found: error

      - name: Prune Caches
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
        env:
          # renovate: datasource=pypi depName=prek depType=dev
          PREK_VERSION: '0.5.5'
        run: |
          uv cache prune --ci
          uv cache prune --ci --cache-dir "$(uvx "prek==${PREK_VERSION}" cache dir)/cache/uv"
          uvx "prek==${PREK_VERSION}" cache gc
          uvx "pre-commit" gc

  Windows:
    runs-on: windows-2025
    timeout-minutes: 70

    strategy:
      fail-fast: false
      max-parallel: 5

    steps:
      - name: Disable Windows Defender Real-time Monitoring
        # Defender scanning every written file impacts at least cache restoration, possibly venv creation.
        # Disable it, the runners are ephemeral.
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need the full history for update tests
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Cache Package Downloads
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |-
            ~\AppData\Local\pip\Cache
            ~\AppData\Local\uv\cache
            ~\AppData\Local\prek
            ~\.cache\pre-commit
          key: testrun-${{ runner.os }}-${{ hashFiles('noxfile.py', 'project/pyproject.toml.j2', 'project/noxfile.py.j2', 'project/.pre-commit-config.yaml.j2') }}
          restore-keys: |-
            testrun-${{ runner.os }}-

      - name: Install uv/nox
        shell: bash
        run: |
          pip install "uv==${UV_VERSION}" "nox==${NOX_VERSION}"
        env:
          # renovate: datasource=pypi depName=nox depType=dev
          NOX_VERSION: '2026.8.17'
          # renovate: datasource=pypi depName=uv depType=dev
          UV_VERSION: '0.13.0'

      - name: Install Test Requirements
        shell: bash
        run: |
          nox --force-color -e tests --install-only

      - name: Test
        shell: bash
        env:
          SKIP_REQUIREMENTS_INSTALL: '1'
        run: |
          nox --force-color -e tests -- -vv --instafail tests/

      - name: Upload Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtests-${{ runner.os }}.log
          path: artifacts/runtests-*.log

      - name: Set Exit Status
        if: ${{ !cancelled() }}
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus
          if-no-files-found: error

      - name: Prune Caches
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          # renovate: datasource=pypi depName=prek depType=dev
          PREK_VERSION: '0.5.5'
        run: |
          uv cache prune --ci
          uv cache prune --ci --cache-dir "$(uvx "prek==${PREK_VERSION}" cache dir)/cache/uv"
          uvx "prek==${PREK_VERSION}" cache gc
          uvx "pre-commit" gc

  macOS:
    # macos-15 hangs indefinitely when running Salt functional tests
    # in the rendered project's test suite (observed 2026-10).
    runs-on: macos-14
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need the full history for update tests
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Cache Package Downloads
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |-
            ~/Library/Caches/pip
            ~/Library/Caches/uv
            ~/.cache/prek
            ~/.cache/pre-commit
          key: testrun-${{ runner.os }}-${{ hashFiles('noxfile.py', 'project/pyproject.toml.j2', 'project/noxfile.py.j2', 'project/.pre-commit-config.yaml.j2') }}
          restore-keys: |-
            testrun-${{ runner.os }}-

      - name: Install uv/nox
        run: |
          pip install "uv==${UV_VERSION}" "nox==${NOX_VERSION}"
        env:
          # renovate: datasource=pypi depName=nox depType=dev
          NOX_VERSION: '2026.8.17'
          # renovate: datasource=pypi depName=uv depType=dev
          UV_VERSION: '0.13.0'

      - name: Install Test Requirements
        run: |
          nox --force-color -e tests --install-only

      - name: Test
        env:
          SKIP_REQUIREMENTS_INSTALL: '1'
        run: |
          nox --force-color -e tests -- -vv --instafail tests/

      - name: Upload Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtests-${{ runner.os }}.log
          path: artifacts/runtests-*.log

      - name: Set Exit Status
        if: ${{ !cancelled() }}
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus
          if-no-files-found: error

      - name: Prune Caches
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
        env:
          # renovate: datasource=pypi depName=prek depType=dev
          PREK_VERSION: '0.5.5'
        run: |
          uv cache prune --ci
          uv cache prune --ci --cache-dir "$(uvx "prek==${PREK_VERSION}" cache dir)/cache/uv"
          uvx "prek==${PREK_VERSION}" cache gc
          uvx "pre-commit" gc
