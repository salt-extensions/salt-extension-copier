---
name: Pre-Commit

on:
  workflow_call:
    inputs:
      changed-files:
        required: true
        type: string
        description: JSON string containing information about changed files

jobs:
  Pre-Commit:
    name: Pre-Commit
    runs-on: ubuntu-26.04
    container:
      # prek-ci-container
      image: ghcr.io/salt-extensions/prek-ci:3.14.8@sha256:c6446caddf6080a101d714d77ad2ae7b9a16148a5bed357d7bb244688211a130

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Hook Environments
        # Release builds must not use cached environments
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          # Hashing this workflow file covers the container pin, which
          # determines the Python installation the hook envs link against.
          key: prek-${{ hashFiles('.github/workflows/pre-commit-action.yml', '.pre-commit-config.yaml') }}

      # prek redirects UV_CACHE_DIR into its own cache, but the nox lint sessions don't
      - name: Cache uv Caches
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: prek-uv-${{ hashFiles('.github/workflows/pre-commit-action.yml', 'pyproject.toml', '.pre-commit-config.yaml') }}
          restore-keys: |-
            prek-uv-

      - name: Install Prek Hooks
        run: |
          prek install-hooks

      - name: Check ALL Files On Branch
        if: github.event_name != 'pull_request' || fromJSON(inputs.changed-files)['pre-commit'] == 'true'
        run: |
          prek run --show-diff-on-failure --color=always --all-files

      - name: Check Changed Files On PR
        # Skip when the previous step already checked all files
        if: github.event_name == 'pull_request' && fromJSON(inputs.changed-files)['repo'] == 'true' && fromJSON(inputs.changed-files)['pre-commit'] != 'true'
        run: |
          prek run --show-diff-on-failure --color=always --files ${{ fromJSON(inputs.changed-files)['repo_files'] }}

      - name: Prune uv Cache
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        run: uv cache prune --ci

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus
          if-no-files-found: error
