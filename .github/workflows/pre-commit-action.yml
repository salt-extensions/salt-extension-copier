---
name: Pre-Commit

on:
  workflow_call:
    inputs:
      changed-files:
        required: true
        type: string
        description: JSON string containing information about changed files

jobs:
  Pre-Commit:
    name: Pre-Commit
    runs-on: ubuntu-26.04
    container:
      # prek-ci-container
      image: docker.io/library/python:3.14.8-slim-trixie@sha256:f85c5697265c178cc6887276c55fe16cf3d14ca35c3df6a5eab3b360534a55d2

    steps:
      - name: Install System Deps
        run: |
          apt-get update
          apt-get install -y git gcc libc-dev
          git config --global --add safe.directory "$(pwd)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Prek
        run: |
          python -m pip install --upgrade pip
          pip install "prek==$PREK_VERSION"
          prek install-hooks
        env:
          # renovate: datasource=pypi depName=prek depType=dev
          PREK_VERSION: '0.5.5'

      - name: Check ALL Files On Branch
        if: github.event_name != 'pull_request' || fromJSON(inputs.changed-files)['pre-commit'] == 'true'
        run: |
          prek run --show-diff-on-failure --color=always --all-files

      - name: Check Changed Files On PR
        # Skip when the previous step already checked all files
        if: github.event_name == 'pull_request' && fromJSON(inputs.changed-files)['repo'] == 'true' && fromJSON(inputs.changed-files)['pre-commit'] != 'true'
        run: |
          prek run --show-diff-on-failure --color=always --files ${{ fromJSON(inputs.changed-files)['repo_files'] }}

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus
          if-no-files-found: error
