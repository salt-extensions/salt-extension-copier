---
name: Pull Request or Push

on:
  push:
    branches:
      - 'main'  # Run on pushes to main
    tags-ignore:
      - '*'   # Ignore pushes to tags
  pull_request:

concurrency:
  # Abort obsolete runs when a PR is updated. Runs for pushes to main
  # are queued instead of cancelled to avoid interrupting deployments;
  # a queued run superseded by a newer push is still cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  call_central_workflow:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: read
