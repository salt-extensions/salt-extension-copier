[pytest]
# Fail hung tests (e.g. stuck Salt daemons in nested test suite runs) with a
# traceback instead of stalling until the CI job timeout kills the whole run.
# Mind that single tests can legitimately take >17 minutes on Windows runners.
# Tests exceeding this need a @pytest.mark.timeout, the job timeout-minutes
# must leave headroom above the effective per-test timeout.
timeout = 1800
filterwarnings =
    ignore::copier.errors.DirtyLocalWarning
